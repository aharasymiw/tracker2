# Fly.io server app config. Secrets (DATABASE_URL, REDIS_URL, SESSION_SECRET, ARGON2_PEPPER) set via `fly secrets set`.

app = "lod-server"
primary_region = "iad"

[build]
  dockerfile = "ops/docker/Dockerfile.server"

[env]
  PORT = "4000"
  NODE_ENV = "production"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    path = "/health"
    interval = "30s"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
